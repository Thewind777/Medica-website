<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Noreva B2B Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              arabic: ['"Almarai"', 'sans-serif'],
            },
            colors: {
              medical: {
                primary: 'var(--color-primary)',
                secondary: 'var(--color-secondary)',
                dark: 'var(--color-dark)',
                accent: 'var(--color-accent)',
                surface: 'var(--color-surface)',
                background: 'var(--color-background)',
                text: 'var(--color-text)',
                subtext: 'var(--color-subtext)',
                border: 'var(--color-border)',
              }
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(var(--color-primary-rgb), 0.1)',
            },
            animation: {
              'slide-up': 'slideUp 0.3s ease-out',
            },
            keyframes: {
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #0891b2;
        --color-secondary: #0e7490;
        --color-dark: #155e75;
        --color-accent: #10b981;
        --color-surface: #ffffff;
        --color-background: #f8fafc;
        --color-text: #0f172a;
        --color-subtext: #475569;
        --color-border: #e2e8f0;
        --color-primary-rgb: 8, 145, 178;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      
      /* Smooth transitions */
      * { transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform; transition-duration: 200ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      
      .font-arabic { letter-spacing: 0px; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-medical-background text-medical-text antialiased selection:bg-medical-primary selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
